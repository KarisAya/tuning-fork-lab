<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0f1f" />
    <title>音叉模拟器 · Wave Lab</title>
  </head>
  <body>
    <main id="app">
      <section id="desk" aria-label="声波实验桌">
        <canvas id="waves"></canvas>
      </section>
      <section id="toolbar" aria-label="工具栏">
        <div id="tools" class="toolbar-group"></div>
        <div class="separator" aria-hidden="true"></div>
        <button class="control-btn" id="btn-pause" type="button">⏸ 暂停</button>
        <button class="control-btn" id="btn-reset" type="button">↺ 重置桌面</button>
        <button class="control-btn" id="btn-export" type="button">⬇ 导出配置</button>
        <button class="control-btn" id="btn-import" type="button">⬆ 加载配置</button>
        <input id="file-input" type="file" accept=".json,application/json" hidden />
        <div class="separator" aria-hidden="true"></div>
        <label class="sample-control">
          <span>波前采样</span>
          <input id="sample-range" type="range" min="64" max="2048" step="64" value="512" />
          <strong id="sample-val">512</strong>
        </label>
        <div class="toolbar-spacer"></div>
        <div class="hint">
          空格暂停 / 继续 · 左键拖动，松手带惯性 · 右键打开工具设置<br />
          隔音板会产生声影与镜面反射 · 端点承担边缘衍射 · 小车会携带声源匀速移动
        </div>
      </section>
    </main>
    <div id="menu" role="menu" aria-hidden="true"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
